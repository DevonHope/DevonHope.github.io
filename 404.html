<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 — File Not Found</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel = "icon" href ="assets/favicon.png"  type = "image/x-icon">
    <style>
        /* small overrides to use explorer-style window for 404 */
        .er-wrap{max-width:920px;margin:28px auto;background:#000;color:#fff;border:2px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,0.6);}
        .er-title{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(#050505,#0a0a0a);border-bottom:1px solid rgba(255,255,255,0.06)}
        .er-body{padding:22px}
        .file-list{background:#060606;border:1px solid rgba(255,255,255,0.04);padding:12px;color:#ddd}
        .file-item{padding:6px 8px;border-bottom:1px dashed rgba(255,255,255,0.03)}
        .file-item:last-child{border-bottom:0}
        .big-404{font-size:20px;color:#FFA584;margin-bottom:12px}
    </style>
</head>
<body>
    <main>
        <div class="er-wrap">
            <div class="er-title">
                <div style="font-weight:700;color:#FFA584;">Explorer — 404</div>
                <div style="color:#bbb">File Not Found</div>
            </div>
            <div class="er-body">
                <div class="big-404">404 — File not found</div>
                <p style="color:#ccc;margin-top:0;margin-bottom:12px">The page you requested could not be located. Below is a mock file explorer showing the site root.</p>
                <div class="file-list" role="list">
                    <div class="file-item">assets/</div>
                    <div class="file-item">css/</div>
                    <div class="file-item">console.js</div>
                    <div class="file-item">explorer.html</div>
                    <div class="file-item">index.html</div>
                    <div class="file-item">pages/ (protected)</div>
                </div>
                <p style="color:#bbb;margin-top:14px">Return to <a href="/" style="color:#FFA584">home</a> or contact <a href="mailto:me@devonhope.net" style="color:#FFA584">me@devonhope.net</a>.</p>
            </div>
        </div>
    </main>
</body>
</html>
